<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=0.7" />
    <title>Simulator Jam</title>

    <style type="text/css">
        html {
            font-family: monospace;
        }

        h1 {
            font-size: xx-large;
        }

        .maincont {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center
        }

        .hidden {
            display: none;
        }

        .btn-active {
            filter: invert(1);
            background-color: coral;
        }


        #clockRaw {
            width: 35vw;
            height: auto;
            margin-top: 2.8vh;
            margin-bottom: 3.8vh;
        }

        #clockRawDiv {
            width: 38vw;
            height: auto;
        }

        .cont-ctrl {
            width: 70%;
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 5.5vw;
            align-items: flex-start;
        }


        .cont-clk-dig {
            display: flex;
            flex-direction: row;
            overflow: hidden;
            align-items: center;
            gap: 0.5vw;
            height: 2.8em;
        }

            .cont-clk-dig input {
                font-size: 1.8em;
                width: 2em;
                font-family: monospace;
            }

        .cont-clk-btn {
            font-size: 2em;
            width: 2em;
            font-family: monospace;
            border: none;
            /*background-color: transparent;*/
        }

/*            .cont-clk-btn:hover {
                filter: invert(1);
                background-color: coral;
            }*/

        #tspeed {
            width: 115%;
        }

        #cont-clk {
            display: flex;
            flex-direction: column;
            gap: 1vw;
            align-items: center;
        }

    </style>

    <script type="text/javascript">
        //Arief Laksono (c) 2026

        const btact = "btn-active";

        /**@type {SVGElement} */
        var svg = null;
        var bbox = null;
        /**@type {SVGElement} */
        var mnt = null;
        var hrs = null;
        var sec = null;
        /**@type {HTMLInputElement} */
        var inp_h = null;
        /**@type {HTMLInputElement} */
        var inp_m = null;
        /**@type {HTMLInputElement} */
        var inp_s = null;

        /**@type {HTMLInputElement} */
        var adjl = null;
        /**@type {HTMLInputElement} */
        var cfwd = null;
        /**@type {HTMLInputElement} */
        var cbck = null;
        /**@type {HTMLInputElement} */
        var movl = null;

        /**@type {HTMLInputElement} */
        var tsp = null;

        var tfire = 1000, dbcnt = 0, wye = 0;
        var hfire = null;
        var tcont = false, dinp = false;

        (function () {

            var htouch = null;

            window.addEventListener("resize", (e) => {
                if (svg) {
                    svg.style.width = svg.id.includes("Div") ?
                        window.innerHeight < window.innerWidth ? "38vw" : "86vw" :
                        window.innerHeight < window.innerWidth ? "35vw" : "70vw";
                }
            });


            window.addEventListener("touchstart", (e) => {
                if (htouch)
                    clearTimeout(htouch);

                wye = (performance.now() - dbcnt) > 400 ? e.touches[0].pageY : null;
            });


            window.addEventListener("touchend", (e) => {
                dbcnt = performance.now();
                wye = null;
                dinp = tcont = false;
                htouch = setTimeout(() => cfwd.hidden = cbck.hidden = tsp.hidden = false, 800);
            });


            var up = 1;

            window.addEventListener("touchmove", (e) => {
                if (wye && tcont) {
                    e.preventDefault();
                    const t = e.touches[0];
                    up = t.pageY - wye > 0 ? -1 : 1;
                    let chg = parseInput(adjl) + up;
                    adjl.value = chg.toString().padStart(2, '0');
                    adjl.dispatchEvent(new Event("change", { bubbles: true }));
                }
            }, { passive: false });

         
            window.addEventListener("click", (e) => {
                if (tsp.hidden && !dinp) {
                    e.preventDefault();
                    let chg = parseInput(adjl) + up;
                    adjl.value = chg.toString().padStart(2, '0');
                    adjl.dispatchEvent(new Event("change", { bubbles: true }));
                }
            });
        })();

        function setClock(hour, minute, second = 0) {
            const bbx = bbox.getBBox();
            const cxy = "," + (bbx.x + bbx.width / 2) + "," + (bbx.y + bbx.height / 2) + ")";
           
            hour = hour / 12 * 360 + minute / 60 * 30 + second / 3600 * 30;
            minute = minute / 60 * 360 + second / 60 * 6;
            second = second / 60 * 360;

            sec.setAttribute("transform", "rotate(" + second + cxy);
            mnt.setAttribute("transform", "rotate(" + minute + cxy);
            hrs.setAttribute("transform", "rotate(" + hour + cxy);
        }

        function setDclock(h, m, s) {
            inp_s.value = s.toString().padStart(2, '0');
            inp_m.value = m.toString().padStart(2, '0');
            inp_h.value = h.toString().padStart(2, '0');
        }

        function parseInput(e) {
            adjl = e;
            let ret = parseInt(e.value, 10);
            return Number.isInteger(ret) ? ret : 0;
        }

        function b64ToByt(v) {
            const b64str = atob(v);
            const ret = new Uint8Array(b64str.length);
            ret.forEach((v, i, a) => a[i] = b64str.charCodeAt(i));
            return ret;
        }

        function initControl(){

            inp_h = document.getElementById("dhh");
            inp_m = document.getElementById("dmm");
            inp_s = document.getElementById("dss");

            cfwd = document.getElementById("clkfwd");
            cfwd.__fincreament = 1;
            cbck = document.getElementById("clkbck");
            cbck.__fincreament = -1;

            tsp = document.getElementById("tspeed");

        }
       
        function initClk(clk) {

            if (svg) svg.classList.toggle("hidden");

            svg = document.getElementById(clk);
            svg.classList.remove("hidden");
            bbox = svg.getElementById("Center");

            sec = svg.getElementById("SecondHand");
            mnt = svg.getElementById("MinuteHand");
            hrs = svg.getElementById("HourHand");

            window.dispatchEvent(new Event("resize", { bubbles: true }));
 
            adjl ??= inp_s;
            movl ??= cfwd;

            inp_s.onchange = (e) => {

                let m = parseInput(inp_m);
                let h = parseInput(inp_h);
                let s = parseInput(inp_s);

                if (s < 0) {
                    s = 59;
                    m--;
                }

                if (m < 0) {
                    m = 59;
                    h--;
                }

                if (h < 0) h = 23;

                if (s >= 60) {
                    m += Math.floor(s / 60);
                    s = s % 60;
                }

                if (m >= 60) {
                    h += Math.floor(m / 60);
                    m = m % 60;
                }

                h %= 24;

                setDclock(h, m, s);
                setClock(h % 12, m, s);
            }

            inp_s.ontouchstart =
                inp_m.ontouchstart =
                inp_h.ontouchstart =
            (e) => {
                adjl = e.target;
                tcont = cfwd.hidden = cbck.hidden = tsp.hidden = true;
            }


            inp_s.onfocus =
                inp_h.onfocus =
                inp_m.onfocus =
            (e) => {
                const viewportHeight = window.visualViewport.height;
                const fullHeight = window.innerHeight;
                dinp = viewportHeight < fullHeight;
            }

  
            inp_m.onchange = (e) => {

                let s = parseInput(inp_s);
                let h = parseInput(inp_h);
                let m = parseInput(inp_m);

                if (m < 0) {
                    m = 59;
                    h--;
                }

                if (h < 0) h = 23;

                if (m >= 60) {
                    h += Math.floor(m / 60);
                    m = m % 60;
                }

                h %= 24;

                setDclock(h, m, s);
                setClock(h % 12, m, s);
            }

            inp_h.onchange = (e) => {

                let s = parseInput(inp_s);
                let m = parseInput(inp_m);
                let h = parseInput(inp_h);


                if (h < 0) h = 23;

                h %= 24;

                setDclock(h, m, s);
                setClock(h % 12, m, s);
            }

            svg.onclick = (e) => {
                if (clk.includes("Div")) initClk("clockRaw");
                else initClk("clockRawDiv");
                adjl?.dispatchEvent(new Event("change", { bubbles: true }));
            }


            tsp.onchange = (e) => {

                /**@type {HTMLInputElement} */
                const r = e.target;
                let f = parseInt(r.value, 10);
                tfire = f > 0 ? (Number(r.max) + Number(r.min)) - parseInt(r.value, 10) : f;

                if (hfire) {
                    clearInterval(hfire);
                    hfire = 0;
                }

                movl.classList.add(btact);
                hfire = setInterval(() => {
                    let chg = parseInput(adjl) + movl.__fincreament;
                    adjl.value = chg.toString().padStart(2, '0');
                    adjl.dispatchEvent(new Event("change", { bubbles: true }));
                }, tfire);

            }


            function movclk(e) {
                if (hfire) {
                    clearInterval(hfire);
                    hfire = 0;
                }
                else {
                    hfire = setInterval(() => {
                        let chg = parseInput(adjl) + movl.__fincreament;
                        adjl.value = chg.toString().padStart(2, '0');
                        adjl.dispatchEvent(new Event("change", { bubbles: true }));
                    }, tfire);
                }
                return hfire;
            }

            cbck.onclick = (e) => {

                movl = e.target;

                if (movclk(e)) cbck.classList.add(btact);
                else cbck.classList.remove(btact);

                if (cfwd.classList.contains(btact))
                    cfwd.classList.toggle(btact);
            }

            cfwd.onclick = (e) => {

                movl = e.target;

                if (movclk(e)) cfwd.classList.add(btact);
                else cfwd.classList.remove(btact);

                if (cbck.classList.contains(btact))
                    cbck.classList.toggle(btact);
            }
        }

        function initGui() {
            initControl();
            initClk("clockRaw");
        }

    </script>
